[project]
name = "unconflict"
version = "0.1.0"
description = "Resolve git merge conflicts: mergiraf first, an LLM only where it gives up, and a deterministic gate that abstains rather than guess."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "pydantic>=2",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[project.optional-dependencies]
eval = ["pyarrow>=15"]

[project.scripts]
unconflict = "unconflict.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyarrow>=15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unconflict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
