<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="920" height="450" viewBox="0 0 920 450" role="img" aria-label="Terminal demo: git merge with unconflict as the merge driver. mergiraf resolves most of the file, the LLM resolves the last conflict, git stops for review, git diff shows the chosen line, and the merge is committed.">
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; white-space: pre; }
  .fg { fill: #d4d4d4; } .dim { fill: #8b8b8b; } .cyan { fill: #4fc1d6; } .green { fill: #6cc96c; }
  .red { fill: #f07178; } .yellow { fill: #e5c07b; } .prompt { fill: #6cc96c; font-weight: 700; }
  .cmd { fill: #ffffff; } .b { font-weight: 700; } .title { fill: #9a9a9a; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; }
</style>
<rect width="920" height="450" rx="10" fill="#1e1e1e"/>
<rect width="920" height="34" rx="10" fill="#2b2b2b"/>
<rect y="24" width="920" height="10" fill="#2b2b2b"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="460" y="21" text-anchor="middle" class="title">git merge, with unconflict as the merge driver</text>
