<g class="s0"><text x="20" y="64"><tspan class="prompt">$ </tspan><tspan class="cmd">git merge feature</tspan></text><rect class="c0" x="35.7" y="50" width="139.1" height="20" fill="#1e1e1e"/></g>
<text x="20" y="84" class="cyan b s1">unconflict: shop.py</text>
<text x="20" y="104" class="fg s2">  stage 1 (structured): mergiraf; 1 conflict(s) left</text>
<text x="20" y="124" class="fg s3">  stage 2/3 (LLM + gate): 1 resolved, 0 resolved after retry, 0 left for you; gate rejected 0 LLM output(s)</text>
<text x="20" y="144" class="fg s4">    conflict #1: llm line 7</text>
<text x="20" y="164" class="yellow s5">  review: LLM-resolved code is in shop.py, see `git diff shop.py`, then `git add shop.py` to accept</text>
<text x="20" y="184" class="dim s6">CONFLICT (content): Merge conflict in shop.py</text>
<g class="s7"><text x="20" y="204"><tspan class="prompt">$ </tspan><tspan class="cmd">git diff shop.py</tspan></text><rect class="c7" x="35.7" y="190" width="131.3" height="20" fill="#1e1e1e"/></g>
<text x="20" y="224" class="cyan s8">@@@ -1,9 -1,9 +1,10 @@@</text>
<text x="20" y="244" class="fg s9">  import json</text>
<text x="20" y="264" class="green s10"> +import math</text>
<text x="20" y="284" class="green s11">+ import logging</text>
<text x="20" y="304" class="fg s12">  def price_with_tax(cents):</text>
<text x="20" y="324" class="red s13">-     return math.ceil(cents * 1.10)</text>
<text x="20" y="344" class="red s14"> -    return cents * 120 // 100</text>
<text x="20" y="364" class="green b s15">++    return math.ceil(cents * 1.20)</text>
<g class="s16"><text x="20" y="384"><tspan class="prompt">$ </tspan><tspan class="cmd">git add shop.py &amp;&amp; git commit -q --no-edit</tspan></text><rect class="c16" x="35.7" y="370" width="334.9" height="20" fill="#1e1e1e"/></g>
<g class="s17"><text x="20" y="404"><tspan class="prompt">$ </tspan><tspan class="cmd">git log --oneline -1</tspan></text><rect class="c17" x="35.7" y="390" width="162.6" height="20" fill="#1e1e1e"/></g>
<text x="20" y="424" class="fg s18">6fa1a77 Merge branch &#x27;feature&#x27;</text>
</svg>
